<div class="login-container">
  <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <h2>Login</h2>

    <div class="form-group">
      <label for="userName">Username</label>
      <input
        type="text"
        id="userName"
        formControlName="userName"
        placeholder="Enter username"
        [class.invalid]="userName?.invalid && (userName?.touched || submitted)"
      />
      <div class="error-message" *ngIf="userName?.invalid && (userName?.touched || submitted)">
        <span *ngIf="userName?.errors?.['required']">Username is required.</span>
        <span *ngIf="userName?.errors?.['minlength']">Username must be at least 4 characters.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        placeholder="Enter password"
        [class.invalid]="password?.invalid && (password?.touched || submitted)"
      />
      <div class="error-message" *ngIf="password?.invalid && (password?.touched || submitted)">
        <span *ngIf="password?.errors?.['required']">Password is required.</span>
        <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</span>
      </div>
    </div>

    <div class="server-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Logging in...' : 'Submit' }}
    </button>
  </form>
</div>
